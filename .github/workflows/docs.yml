name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documents
        run: python3 scripts/validate_docs.py
      - name: Test the validator
        run: python3 -m unittest discover -s scripts -p 'test_validate_docs.py'
